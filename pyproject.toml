[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buergerai"
version = "0.6.0"
description = "Regelbasierte Ermittlung öffentlicher Leistungen in Deutschland (bundesweit, ohne LLM)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Janis Uhrig"}]
keywords = ["buergerai", "sozialleistungen", "deutschland", "behoerden"]
# Bewusst keine Laufzeit-Abhängigkeiten (nur Standardbibliothek), siehe docs/adr/0002
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
buergerai = "buergerai.cli:main"

[project.urls]
Repository = "https://github.com/uhrigjanis/BuergerAi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"buergerai.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
