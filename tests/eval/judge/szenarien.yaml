# Judge-Tests aus den Szenarien (szenarien/*.json, #83)
#
# Je Szenario eine ausgedachte Anfrage im Stil der Persona. Erwartet sind die Lebenslagen des
# Szenarios (ohne Angabe: geburt). Wo eine zweite Lebenslage vertretbar ist, steht statt einer
# exakten Liste die Erwartung der Fachperson (experte), geprüft mit --judge.
# leistungen: im Szenario mit "ja" erwartet (noch nicht geprüft, folgt mit Extraktion und Engine).
# pytest prüft, dass jedes Szenario hier einen Test hat und die Lebenslagen übereinstimmen.
# Ausführen: ./bai eval judge --datei tests/eval/judge/szenarien.yaml

tests:

  - id: szenario-arbeit-berlin-versicherung-unbekannt
    stichtag: 2026-10-26
    anfrage: "Mein befristeter Vertrag im Lager läuft Ende Februar aus. Ich war noch nie arbeitslos und weiß nicht genau, wie lange ich versichert war. Was muss ich machen?"
    erwartet:
      kategorie: lebenslage
      lebenslagen: [jobverlust]
      leistungen: [arbeitsuchend_melden, erwerbslosenberatung]
      nicht_erwartet:
        lebenslagen: [ruhestand, selbststaendig]
    experte: "Es geht um Job verloren oder gekündigt. Ohne Angabe zur Versicherungszeit bleibt das Arbeitslosengeld unklar statt erfunden."
    notiz: "Szenario szenarien/arbeit_berlin_versicherung_unbekannt.json: Job verloren: Befristung in Berlin, Versicherungszeit unbekannt"

  - id: szenario-arbeit-hannover-insolvenz
    stichtag: 2026-10-26
    anfrage: "Unsere Firma hat Anfang Oktober Insolvenz angemeldet. Seit Wochen gibt es kaum noch Aufträge, die Löhne kamen zu spät und jetzt endet mein Arbeitsverhältnis zum 30. November. Ich arbeite dort als Buchhalterin. Ich habe gehört, dass es Insolvenzgeld gibt. Was steht mir zu und was muss ich jetzt tun?"
    erwartet:
      kategorie: lebenslage
      lebenslagen: [jobverlust]
      leistungen: [insolvenzgeld, arbeitslosengeld, erwerbslosenberatung]
      nicht_erwartet:
        lebenslagen: [geringes_einkommen, selbststaendig]
    experte: "Es geht um Job verloren oder gekündigt. Insolvenzgeld mit Ausschlussfrist zwei Monate nach dem Insolvenzereignis; Erwerbslosenberatung des Landes Niedersachsen."
    notiz: "Szenario szenarien/arbeit_hannover_insolvenz.json: Job verloren: Insolvenz des Arbeitgebers in Hannover"

  - id: szenario-arbeit-koeln-kuendigung
