    experte: "Es geht um Job verloren oder gekündigt. Arbeitsuchend melden mit Drei-Tage-Frist ab Kündigung, Klagefrist drei Wochen, Arbeitslosengeld; Beratungsstelle Arbeit des Landes NRW."
