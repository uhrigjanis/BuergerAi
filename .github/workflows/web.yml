name: Web-Oberfläche

# Browser-Rauchtest (scripts/web_rauchtest.py) und JS-Syntax für die Web-Oberfläche.
# Kein Pflicht-Check: Wegen des Pfadfilters startet er nicht bei jedem PR (siehe tests.yml).
# Playwright ist keine Projekt-Abhängigkeit (ADR 0002) und wird nur hier installiert.

on:
  pull_request:
    paths:
      - "src/buergerai/web/**"
      - "src/buergerai/llm/**"
      - "scripts/web_rauchtest.py"
      - "tests/test_web.py"
      - "tests/test_web_freitext.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Node 22 erkennt ES-Module auch in .js-Dateien
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS-Syntax (node --check)
        run: |
          for f in src/buergerai/web/static/*.js; do
            node --check "$f" || exit 1
          done
          echo "$(ls src/buergerai/web/static/*.js | wc -l) Dateien ohne Syntaxfehler"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Playwright installieren
        run: |
          python -m pip install playwright pytest
          python -m playwright install --with-deps chromium
      - name: Browser-Rauchtest
        env:
          PYTHONPATH: src:tests
        run: python scripts/web_rauchtest.py --chromium --ausgabe rauchtest-bilder
      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rauchtest-bilder
          path: rauchtest-bilder
          if-no-files-found: ignore
          retention-days: 7
