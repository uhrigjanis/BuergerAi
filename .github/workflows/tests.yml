name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: pytest installieren
        run: python -m pip install pytest
      - name: Wissensbasis prüfen
        run: ./bai --keine-farbe daten
      - name: Szenarien prüfen
        run: ./bai --keine-farbe szenarien --pruefen
      - name: Tests
        run: python -m pytest
