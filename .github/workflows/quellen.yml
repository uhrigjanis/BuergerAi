name: Quellenprüfung

# Prüft Zitate und Zahlen gegen den Text der Quellen und alle Quellen-Links.
# Achtung: gesetze-im-internet.de ist von GitHub-Runnern aus NICHT erreichbar
# (siehe Diagnose-Schritt unten und #66). Bundesgesetze werden daher lokal
# abgeglichen; hier greift der Abgleich nur für die übrigen Seiten.
# Kein Pflicht-Check (#69): Wegen des Pfadfilters startet er nicht bei jedem
# PR, und er hängt von externen Seiten ab. Siehe docs/pruefprotokolle/README.md.

on:
  pull_request:
    paths:
      - "data/**"
      - "docs/pruefprotokolle/**"
      - "src/buergerai/abgleich.py"
      - "src/buergerai/quelltext.py"
      - "src/buergerai/linkpruefung.py"
      - ".github/workflows/quellen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abgleich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Diagnose: gesetze-im-internet.de verwirft Verbindungen von GitHub-Runnern (IPv4: Zeitüberschreitung,
      # kein IPv6). Bleibt drin, damit sichtbar wird, falls sich das ändert.
      - name: Erreichbarkeit gesetze-im-internet.de (Diagnose)
        continue-on-error: true
        run: |
          for ip in -4 -6; do
            echo "== curl $ip"
            curl $ip -sS -m 10 -o /dev/null -w "HTTP %{http_code}, %{size_download} Bytes, %{time_total} s, IP %{remote_ip}\n" \
              -A "BuergerAI-Quellenabgleich" https://www.gesetze-im-internet.de/beeg/xml.zip || true
          done
      # Schlägt nur fehl, wenn ein Zitat aus einem Protokoll nicht im Quelltext steht.
      # Nicht gefundene Zahlen sind Hinweise und stehen nur in der Zusammenfassung.
      - name: Zitate und Zahlen abgleichen (Phase 1)
        run: ./bai --keine-farbe quellen --abgleich --phase1 --bericht "$GITHUB_STEP_SUMMARY"
      - name: Zitate und Zahlen abgleichen (alle Quellen mit Protokoll)
        if: success() || failure()
        run: ./bai --keine-farbe quellen --abgleich --bericht "$GITHUB_STEP_SUMMARY"
      # Tote Links sollen auffallen, aber keinen PR blockieren.
      - name: Links prüfen
        if: success() || failure()
        continue-on-error: true
        run: ./bai --keine-farbe quellen --links
